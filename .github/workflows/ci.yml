name: CI

on:
  push:
    branches: [master, dev, Wac]
  pull_request:
    branches: [master, dev]

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          src: "backend/"

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-test.txt
          pip install pytest-asyncio
      - name: Run tests
        run: cd backend && python -m pytest tests/ -v --tb=short

  sandbox-runtime:
    name: Runtime Sandbox (real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build runtime sandbox image
        run: docker build -f backend/Dockerfile.sandbox -t agenthub-runtime-sandbox:local backend
      - name: Install test dependencies
        run: pip install -r backend/requirements-test.txt
      - name: Run real container smoke tests
        env:
          AGENTHUB_DOCKER_INTEGRATION: "1"
        run: cd backend && python -m pytest tests/test_sandbox_docker_integration.py -v

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install and lint
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run lint

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install and test
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run test

  frontend-container:
    name: Frontend Container (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -t agenthub-frontend:local frontend
      - name: Run Nginx smoke test
        run: |
          docker run --rm -d --name agenthub-frontend-smoke -p 8080:80 agenthub-frontend:local
          trap 'docker rm -f agenthub-frontend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          docker logs agenthub-frontend-smoke
          exit 1

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-test.txt
          pip install pytest-asyncio
          cd ../frontend
          npm ci --legacy-peer-deps
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run core journey
        env:
          REAL_BACKEND: "1"
          AGENTHUB_REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/agenthub-e2e-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health || { cat /tmp/agenthub-e2e-backend.log; exit 1; }
          cd ../frontend
          npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/agenthub-e2e-backend.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r backend/app/ -ll -q
