name: CI

on:
  push:
  pull_request:
    branches: [master, dev]

jobs:
  backend-lint:
    name: Backend Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          src: "backend/"

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-test.lock
      - name: Run tests
        run: cd backend && python -m pytest tests/ -v --tb=short

  sandbox-runtime:
    name: Runtime Sandbox (real Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build runtime sandbox image
        run: docker build -f backend/Dockerfile.sandbox -t agenthub-runtime-sandbox:local backend
      - name: Install test dependencies
        run: pip install -r backend/requirements-test.lock
      - name: Run real container smoke tests
        env:
          AGENTHUB_DOCKER_INTEGRATION: "1"
        run: cd backend && python -m pytest tests/test_sandbox_docker_integration.py -v

  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and lint
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run lint

  frontend-test:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and test
        run: |
          cd frontend
          npm ci --legacy-peer-deps
          npm run test

  frontend-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenthub_e2e
          POSTGRES_USER: agenthub
          POSTGRES_PASSWORD: agenthub-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenthub -d agenthub_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements-test.lock
          cd ../frontend
          npm ci --legacy-peer-deps
      - name: Install Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run core journey
        env:
          REAL_BACKEND: "1"
          AGENTHUB_REDIS_URL: redis://127.0.0.1:6379/0
          AGENTHUB_AUTO_MIGRATE: "false"
          AGENTHUB_ALLOW_HOST_DOCKER_SOCKET: "true"
          DATABASE_URL: postgresql+psycopg://agenthub:agenthub-test@127.0.0.1:5432/agenthub_e2e
        run: |
          cd backend
          python -m app.scripts.migrate
          python -m app.workers.deployment_worker > /tmp/agenthub-e2e-worker.log 2>&1 &
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/agenthub-e2e-backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health || { cat /tmp/agenthub-e2e-backend.log; exit 1; }
          cd ../frontend
          npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/agenthub-e2e-backend.log
            /tmp/agenthub-e2e-worker.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r backend/app/ -ll -q
