services:
  backend:
    build: ./backend
    container_name: agenthub-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
      - generated_projects:/agenthub_export
    networks:
      - default
      - runtime
    environment:
      - AGENTHUB_HOST=0.0.0.0
      - AGENTHUB_PORT=8000
      - AGENTHUB_DEBUG=false
      - AGENTHUB_API_SECRET=${AGENTHUB_API_SECRET:-}
      - AGENTHUB_ENCRYPT_KEY=${AGENTHUB_ENCRYPT_KEY:-}
      - AGENTHUB_AUTH_MODE=${AGENTHUB_AUTH_MODE:-shared}
      - AGENTHUB_TRUSTED_PROXY_SECRET=${AGENTHUB_TRUSTED_PROXY_SECRET:-}
      - AGENTHUB_TRUSTED_IDENTITY_HEADER=${AGENTHUB_TRUSTED_IDENTITY_HEADER:-x-agenthub-auth-user}
      - AGENTHUB_TRUSTED_ROLE_HEADER=${AGENTHUB_TRUSTED_ROLE_HEADER:-x-agenthub-auth-role}
      - AGENTHUB_API_CLIENT_TOKENS_JSON=${AGENTHUB_API_CLIENT_TOKENS_JSON:-}
      - AGENTHUB_STORAGE_BACKEND=${AGENTHUB_STORAGE_BACKEND:-local}
      - AGENTHUB_S3_BUCKET=${AGENTHUB_S3_BUCKET:-}
      - AGENTHUB_S3_PREFIX=${AGENTHUB_S3_PREFIX:-agenthub}
      - AGENTHUB_S3_ENDPOINT_URL=${AGENTHUB_S3_ENDPOINT_URL:-}
      - AGENTHUB_S3_REGION=${AGENTHUB_S3_REGION:-us-east-1}
      - AGENTHUB_S3_ACCESS_KEY_ID=${AGENTHUB_S3_ACCESS_KEY_ID:-}
      - AGENTHUB_S3_SECRET_ACCESS_KEY=${AGENTHUB_S3_SECRET_ACCESS_KEY:-}
      - AGENTHUB_CHROMA_HOST=${AGENTHUB_CHROMA_HOST:-}
      - AGENTHUB_CHROMA_PORT=${AGENTHUB_CHROMA_PORT:-8000}
      - AGENTHUB_CHROMA_SSL=${AGENTHUB_CHROMA_SSL:-false}
      - AGENTHUB_REDIS_URL=redis://:${REDIS_PASSWORD:-agenthub_redis_secret}@redis:6379/0
      - AGENTHUB_AUTO_MIGRATE=false
      - DATABASE_URL=postgresql+psycopg://agenthub:${POSTGRES_PASSWORD:-agenthub_postgres_secret}@postgres:5432/agenthub
      # LLM config (can override via .env file)
      - AGENTHUB_LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - AGENTHUB_LLM_API_KEY=${LLM_API_KEY:-}
      - AGENTHUB_LLM_BASE_URL=${LLM_BASE_URL:-}
      - AGENTHUB_LLM_MODEL=${LLM_MODEL:-}
      # Optional static-site publishing via Netlify
      - AGENTHUB_NETLIFY_TOKEN=${AGENTHUB_NETLIFY_TOKEN:-}
      - AGENTHUB_NETLIFY_SITE_ID=${AGENTHUB_NETLIFY_SITE_ID:-}
      - AGENTHUB_PUBLIC_BASE_URL=${AGENTHUB_PUBLIC_BASE_URL:-}
      - AGENTHUB_RUNTIME_NETWORK=agenthub_runtime
      - AGENTHUB_RUNTIME_SANDBOX_IMAGE=${AGENTHUB_RUNTIME_SANDBOX_IMAGE:-agenthub-runtime-sandbox:local}
      - AGENTHUB_RUNTIME_SANDBOX_MEMORY=${AGENTHUB_RUNTIME_SANDBOX_MEMORY:-768m}
      - AGENTHUB_RUNTIME_SANDBOX_CPUS=${AGENTHUB_RUNTIME_SANDBOX_CPUS:-1.5}
      - AGENTHUB_RUNTIME_SANDBOX_PIDS=${AGENTHUB_RUNTIME_SANDBOX_PIDS:-128}
      - AGENTHUB_RUNTIME_SANDBOX_TIMEOUT=${AGENTHUB_RUNTIME_SANDBOX_TIMEOUT:-120}
      - AGENTHUB_RUNTIME_SANDBOX_MAX_CONCURRENCY=${AGENTHUB_RUNTIME_SANDBOX_MAX_CONCURRENCY:-4}
      - AGENTHUB_RUNTIME_SANDBOX_MAX_PER_TENANT=${AGENTHUB_RUNTIME_SANDBOX_MAX_PER_TENANT:-1}
      - AGENTHUB_PREVIEW_RUNTIME_MAX_TOTAL=${AGENTHUB_PREVIEW_RUNTIME_MAX_TOTAL:-8}
      - AGENTHUB_PREVIEW_RUNTIME_MAX_PER_TENANT=${AGENTHUB_PREVIEW_RUNTIME_MAX_PER_TENANT:-2}
      - AGENTHUB_SCHEDULER_LEADER_TTL=${AGENTHUB_SCHEDULER_LEADER_TTL:-20}
      - AGENTHUB_GENERATION_LEASE_TTL=${AGENTHUB_GENERATION_LEASE_TTL:-90}
      - AGENTHUB_GENERATION_MAX_PER_USER=${AGENTHUB_GENERATION_MAX_PER_USER:-2}
      - AGENTHUB_GENERATION_WORKER_CONCURRENCY=${AGENTHUB_GENERATION_WORKER_CONCURRENCY:-4}
      - AGENTHUB_GENERATION_WORKER_ENABLED=true
      - AGENTHUB_LLM_DAILY_TOKEN_QUOTA=${AGENTHUB_LLM_DAILY_TOKEN_QUOTA:-0}
      - AGENTHUB_RUNTIME_SANDBOX_QUEUE_TIMEOUT=${AGENTHUB_RUNTIME_SANDBOX_QUEUE_TIMEOUT:-30}
      - AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_TIMEOUT=${AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_TIMEOUT:-300}
      - AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_CACHE_MAX=${AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_CACHE_MAX:-100}
      - AGENTHUB_RUNTIME_DEPENDENCY_NETWORK=${AGENTHUB_RUNTIME_DEPENDENCY_NETWORK:-bridge}
      - AGENTHUB_RUNTIME_NPM_REGISTRY=${AGENTHUB_RUNTIME_NPM_REGISTRY:-https://registry.npmjs.org}
      - AGENTHUB_RUNTIME_PYPI_INDEX_URL=${AGENTHUB_RUNTIME_PYPI_INDEX_URL:-https://pypi.org/simple}
      - AGENTHUB_E2B_TEMPLATE_ID=${AGENTHUB_E2B_TEMPLATE_ID:-code-interpreter}
      - DOCKER_HOST=${DOCKER_HOST:-}
      - DOCKER_TLS_VERIFY=${DOCKER_TLS_VERIFY:-}
      - DOCKER_CERT_PATH=${DOCKER_CERT_PATH:-}
      # Optional Human-in-the-Loop notifications
      - AGENTHUB_SLACK_WEBHOOK_URL=${AGENTHUB_SLACK_WEBHOOK_URL:-}
      - AGENTHUB_TELEGRAM_BOT_TOKEN=${AGENTHUB_TELEGRAM_BOT_TOKEN:-}
      - AGENTHUB_TELEGRAM_CHAT_ID=${AGENTHUB_TELEGRAM_CHAT_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      generation-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: agenthub-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  migration:
    build: ./backend
    restart: "no"
    command: ["python", "-m", "app.scripts.migrate"]
    environment:
      - AGENTHUB_DEBUG=false
      - AGENTHUB_ENCRYPT_KEY=${AGENTHUB_ENCRYPT_KEY:-local-migration-key}
      - DATABASE_URL=postgresql+psycopg://agenthub:${POSTGRES_PASSWORD:-agenthub_postgres_secret}@postgres:5432/agenthub
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  generation-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.workers.generation_worker"]
    environment:
      - AGENTHUB_DEBUG=false
      - AGENTHUB_REDIS_URL=redis://:${REDIS_PASSWORD:-agenthub_redis_secret}@redis:6379/0
      - AGENTHUB_ENCRYPT_KEY=${AGENTHUB_ENCRYPT_KEY:-}
      - AGENTHUB_LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - AGENTHUB_LLM_API_KEY=${LLM_API_KEY:-}
      - AGENTHUB_LLM_BASE_URL=${LLM_BASE_URL:-}
      - AGENTHUB_LLM_MODEL=${LLM_MODEL:-}
      - AGENTHUB_STORAGE_BACKEND=${AGENTHUB_STORAGE_BACKEND:-local}
      - AGENTHUB_S3_BUCKET=${AGENTHUB_S3_BUCKET:-}
      - AGENTHUB_S3_PREFIX=${AGENTHUB_S3_PREFIX:-agenthub}
      - AGENTHUB_S3_ENDPOINT_URL=${AGENTHUB_S3_ENDPOINT_URL:-}
      - AGENTHUB_S3_REGION=${AGENTHUB_S3_REGION:-us-east-1}
      - AGENTHUB_S3_ACCESS_KEY_ID=${AGENTHUB_S3_ACCESS_KEY_ID:-}
      - AGENTHUB_S3_SECRET_ACCESS_KEY=${AGENTHUB_S3_SECRET_ACCESS_KEY:-}
      - AGENTHUB_CHROMA_HOST=${AGENTHUB_CHROMA_HOST:-}
      - AGENTHUB_CHROMA_PORT=${AGENTHUB_CHROMA_PORT:-8000}
      - AGENTHUB_CHROMA_SSL=${AGENTHUB_CHROMA_SSL:-false}
      - AGENTHUB_GENERATION_WORKER_ENABLED=true
      - AGENTHUB_GENERATION_LEASE_TTL=${AGENTHUB_GENERATION_LEASE_TTL:-90}
      - AGENTHUB_GENERATION_MAX_PER_USER=${AGENTHUB_GENERATION_MAX_PER_USER:-2}
      - AGENTHUB_GENERATION_WORKER_CONCURRENCY=${AGENTHUB_GENERATION_WORKER_CONCURRENCY:-4}
      - AGENTHUB_LLM_DAILY_TOKEN_QUOTA=${AGENTHUB_LLM_DAILY_TOKEN_QUOTA:-0}
      - AGENTHUB_RUNTIME_SANDBOX_IMAGE=${AGENTHUB_RUNTIME_SANDBOX_IMAGE:-agenthub-runtime-sandbox:local}
      - AGENTHUB_RUNTIME_SANDBOX_MEMORY=${AGENTHUB_RUNTIME_SANDBOX_MEMORY:-768m}
      - AGENTHUB_RUNTIME_SANDBOX_CPUS=${AGENTHUB_RUNTIME_SANDBOX_CPUS:-1.5}
      - AGENTHUB_RUNTIME_SANDBOX_PIDS=${AGENTHUB_RUNTIME_SANDBOX_PIDS:-128}
      - AGENTHUB_RUNTIME_SANDBOX_TIMEOUT=${AGENTHUB_RUNTIME_SANDBOX_TIMEOUT:-120}
      - AGENTHUB_RUNTIME_SANDBOX_MAX_CONCURRENCY=${AGENTHUB_RUNTIME_SANDBOX_MAX_CONCURRENCY:-4}
      - AGENTHUB_RUNTIME_SANDBOX_MAX_PER_TENANT=${AGENTHUB_RUNTIME_SANDBOX_MAX_PER_TENANT:-1}
      - AGENTHUB_RUNTIME_SANDBOX_QUEUE_TIMEOUT=${AGENTHUB_RUNTIME_SANDBOX_QUEUE_TIMEOUT:-30}
      - AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_TIMEOUT=${AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_TIMEOUT:-300}
      - AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_CACHE_MAX=${AGENTHUB_RUNTIME_SANDBOX_DEPENDENCY_CACHE_MAX:-100}
      - AGENTHUB_RUNTIME_DEPENDENCY_NETWORK=${AGENTHUB_RUNTIME_DEPENDENCY_NETWORK:-bridge}
      - AGENTHUB_RUNTIME_NPM_REGISTRY=${AGENTHUB_RUNTIME_NPM_REGISTRY:-https://registry.npmjs.org}
      - AGENTHUB_RUNTIME_PYPI_INDEX_URL=${AGENTHUB_RUNTIME_PYPI_INDEX_URL:-https://pypi.org/simple}
      - AGENTHUB_E2B_TEMPLATE_ID=${AGENTHUB_E2B_TEMPLATE_ID:-code-interpreter}
      - AGENTHUB_SLACK_WEBHOOK_URL=${AGENTHUB_SLACK_WEBHOOK_URL:-}
      - AGENTHUB_TELEGRAM_BOT_TOKEN=${AGENTHUB_TELEGRAM_BOT_TOKEN:-}
      - AGENTHUB_TELEGRAM_CHAT_ID=${AGENTHUB_TELEGRAM_CHAT_ID:-}
      - DOCKER_HOST=${DOCKER_HOST:-}
      - DOCKER_TLS_VERIFY=${DOCKER_TLS_VERIFY:-}
      - DOCKER_CERT_PATH=${DOCKER_CERT_PATH:-}
      - DATABASE_URL=postgresql+psycopg://agenthub:${POSTGRES_PASSWORD:-agenthub_postgres_secret}@postgres:5432/agenthub
    volumes:
      - backend_data:/app/data
      - generated_projects:/agenthub_export
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.generation_worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  deployment-worker:
    profiles: ["deployment"]
    image: agenthub-deployment-worker:local
    build:
      context: ./backend
      dockerfile: Dockerfile.builder
    restart: unless-stopped
    read_only: true
    mem_limit: 4g
    cpus: 2.5
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    environment:
      - AGENTHUB_REDIS_URL=redis://:${REDIS_PASSWORD:-agenthub_redis_secret}@redis:6379/0
      - AGENTHUB_DEBUG=false
      - AGENTHUB_ALLOW_HOST_DOCKER_SOCKET=false
      - DOCKER_HOST=${DOCKER_HOST:-}
      - AGENTHUB_ENCRYPT_KEY=${AGENTHUB_ENCRYPT_KEY:-}
      - AGENTHUB_STORAGE_BACKEND=${AGENTHUB_STORAGE_BACKEND:-local}
      - AGENTHUB_S3_BUCKET=${AGENTHUB_S3_BUCKET:-}
      - AGENTHUB_S3_PREFIX=${AGENTHUB_S3_PREFIX:-agenthub}
      - AGENTHUB_S3_ENDPOINT_URL=${AGENTHUB_S3_ENDPOINT_URL:-}
      - AGENTHUB_S3_REGION=${AGENTHUB_S3_REGION:-us-east-1}
      - AGENTHUB_S3_ACCESS_KEY_ID=${AGENTHUB_S3_ACCESS_KEY_ID:-}
      - AGENTHUB_S3_SECRET_ACCESS_KEY=${AGENTHUB_S3_SECRET_ACCESS_KEY:-}
      - AGENTHUB_NETLIFY_TOKEN=${AGENTHUB_NETLIFY_TOKEN:-}
      - AGENTHUB_NETLIFY_SITE_ID=${AGENTHUB_NETLIFY_SITE_ID:-}
      - AGENTHUB_PUBLIC_BASE_URL=${AGENTHUB_PUBLIC_BASE_URL:-}
      - AGENTHUB_RUNTIME_NETWORK=agenthub_runtime
      - AGENTHUB_BUILDER_IMAGE=agenthub-deployment-worker:local
      - AGENTHUB_RUNTIME_SANDBOX_IMAGE=${AGENTHUB_RUNTIME_SANDBOX_IMAGE:-agenthub-runtime-sandbox:local}
      - AGENTHUB_RUNTIME_DEPENDENCY_NETWORK=${AGENTHUB_RUNTIME_DEPENDENCY_NETWORK:-bridge}
      - AGENTHUB_GENERATED_PROJECTS_VOLUME=agenthub_generated_projects
      - AGENTHUB_DEPLOYMENT_BUILD_NETWORK=${AGENTHUB_DEPLOYMENT_BUILD_NETWORK:-default}
      - AGENTHUB_DEPLOYMENT_BUILD_MEMORY=${AGENTHUB_DEPLOYMENT_BUILD_MEMORY:-2g}
      - AGENTHUB_DEPLOYMENT_BUILD_CPUS=${AGENTHUB_DEPLOYMENT_BUILD_CPUS:-2.0}
      - AGENTHUB_DEPLOYMENT_BUILD_PIDS=${AGENTHUB_DEPLOYMENT_BUILD_PIDS:-256}
      - AGENTHUB_API_RUNTIME_MEMORY=${AGENTHUB_API_RUNTIME_MEMORY:-512m}
      - AGENTHUB_API_RUNTIME_CPUS=${AGENTHUB_API_RUNTIME_CPUS:-1.0}
      - AGENTHUB_API_RUNTIME_PIDS=${AGENTHUB_API_RUNTIME_PIDS:-128}
      - AGENTHUB_DEPLOYMENT_RETENTION_DAYS=${AGENTHUB_DEPLOYMENT_RETENTION_DAYS:-7}
      - AGENTHUB_DEPLOYMENT_MAX_PER_USER=${AGENTHUB_DEPLOYMENT_MAX_PER_USER:-20}
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - backend_data:/app/data
      - generated_projects:/agenthub_export
      - builder_gradle_cache:/root/.gradle
    networks:
      - default
      - runtime
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import asyncio; from app.core.redis import redis_manager; raise SystemExit(0 if asyncio.run(redis_manager.check_connection()) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  runtime-sandbox-image:
    profiles: ["deployment"]
    image: ${AGENTHUB_RUNTIME_SANDBOX_IMAGE:-agenthub-runtime-sandbox:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.sandbox
    command: ["true"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-agenthub_redis_secret}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agenthub_redis_secret}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: agenthub-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=agenthub
      - POSTGRES_USER=agenthub
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agenthub_postgres_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  generated_projects:
    name: agenthub_generated_projects
    driver: local
  builder_gradle_cache:
    driver: local

networks:
  runtime:
    name: agenthub_runtime
    internal: true
