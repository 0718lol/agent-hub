# Ruff configuration — Python linter and formatter
# https://docs.astral.sh/ruff/configuration/

# Target Python 3.12+
target-version = "py312"

# Line length matching common Python style
line-length = 120

# Source directories
src = ["app"]

# Exclude patterns
exclude = [
    ".git",
    "__pycache__",
    "*.egg-info",
    "venv",
    ".venv",
    "harness",
    "alembic",
    "tests",
    "gen_test.py",
]

[lint]
# Enable rule groups
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import sorting)
]

# Ignore specific rules that are too noisy for this codebase
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module import not at top (sometimes necessary)
    "E701",   # multiple statements on one line
    "E741",   # ambiguous variable name
    "F401",   # unused import (re-exports via __init__.py)
    "F405",   # undefined name from star import
    "W291",   # trailing whitespace
    "W293",   # blank line with whitespace
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[lint.isort]
known-first-party = ["app"]

[format]
# Use double quotes for strings
quote-style = "double"

# Use spaces for indentation
indent-style = "space"
